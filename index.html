const JOURNEYS=[{name:'相遇 · 心动 · 失去 · 成长',stages:[{label:'相遇',theme:'love'},{label:'心动',theme:'love'},{label:'失去',theme:'farewell'},{label:'成长',theme:'growth'}]},{name:'孤独 · 自我觉醒 · 和解',stages:[{label:'孤独',theme:'loneliness'},{label:'自我觉醒',theme:'growth'},{label:'和解',theme:'healing'}]},{name:'心动 · 错过 · 告别',stages:[{label:'心动',theme:'crush'},{label:'错过',theme:'regret'},{label:'告别',theme:'farewell'}]}];
const SECTIONS={love:{title:'Love Lines',zh:'爱情台词',ids:['love','crush','breakup','reunion'],desc:'不只收甜蜜情话，也收"为什么爱""成年人的爱为什么难""明明相爱为何分开"这些更复杂的情绪。'},life:{title:'Life Lines',zh:'人生台词',ids:['life','growth','loneliness','regret','youth','dream'],desc:'关于成长、选择、孤独、失败与生活本身，适合慢慢读的文学性段落。'},healing:{title:'Healing Lines',zh:'治愈台词',ids:['healing'],desc:'让人安静下来、重新理解自己或他人的台词——都来自具体剧情，而非泛滥鸡汤。'},human:{title:'Human Nature',zh:'人性与现实',ids:['human','society','work','female','family'],desc:'关于欲望、阶层、金钱、权力、家庭与职场，来自现实与社会题材的有思想表达。'},suspense:{title:'Suspense & Crime',zh:'悬疑犯罪台词',ids:['suspense','crime'],desc:'看韩剧如何用一句话制造心理张力、关系裂痕与关于真相正义的追问。'},law:{title:'Law & Justice',zh:'法律与正义',ids:['law'],desc:'法律题材中的经典表达。请注意：角色台词是戏剧表达，不是现实法律结论。'}};
const RANK=['KDL-002','KDL-013','KDL-019','KDL-017','KDL-015','KDL-005','KDL-020','KDL-001','KDL-027','KDL-006'];
const store={get favs(){try{return JSON.parse(localStorage.getItem('kdl2_favs')||'[]')}catch(e){return[]}},set favs(v){localStorage.setItem('kdl2_favs',JSON.stringify(v))},get read(){try{return JSON.parse(localStorage.getItem('kdl2_read')||'[]')}catch(e){return[]}},set read(v){localStorage.setItem('kdl2_read',JSON.stringify(v))},get tags(){try{return JSON.parse(localStorage.getItem('kdl2_tags')||'{}')}catch(e){return{}}},set tags(v){localStorage.setItem('kdl2_tags',JSON.stringify(v))},get theme(){return localStorage.getItem('kdl2_theme')||'light'},set theme(v){localStorage.setItem('kdl2_theme',v)},get ko(){return localStorage.getItem('kdl2_ko')==='1'},set ko(v){localStorage.setItem('kdl2_ko',v?'1':'0')}};
let S={view:'home',filter:null,detail:null,search:'',favFilter:'time'};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const byId=id=>LINES.find(l=>l.id===id);
const D=l=>DRAMAS[l.drama];
const linesByT=t=>LINES.filter(l=>l.themes.includes(t));
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tname=t=>THEMES[t]?THEMES[t].zh:t;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1700)}
function markRead(id){let r=store.read;if(!r.includes(id)){r.push(id);store.read=r}}
function toggleFav(id){let f=store.favs;if(f.includes(id)){f=f.filter(x=>x!==id);toast('已从台词书移除')}else{f.push(id);toast('收进我的台词书')}store.favs=f;render()}
function recForYou(){const f=store.favs.map(byId).filter(Boolean);if(!f.length)return RANK.slice(0,3).map(byId);const cnt={};f.forEach(l=>l.themes.forEach(t=>cnt[t]=(cnt[t]||0)+1));const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0][0];return LINES.filter(l=>l.themes.includes(top)&&!store.favs.includes(l.id)).slice(0,3)}
function todayLine(){const d=new Date();return LINES[(d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate())%LINES.length]}
function randLine(){return LINES[Math.floor(Math.random()*LINES.length)]}
function tagsHtml(l){return l.themes.map(t=>`<span class="tag" data-t="${t}">${tname(t)}</span>`).join('')}
function ltHtml(l){return (l.lineType||[]).map(x=>`<span class="tag lt">${x}</span>`).join('')}
function badge(l){if(l.verify==='v')return'<span class="badge v">字幕核校</span>';if(l.zhType==='reference')return'<span class="badge r">中文·参考译文</span>';return'<span class="badge c">字幕整理</span>'}
function lcard(l){const faved=store.favs.includes(l.id),read=store.read.includes(l.id);return `<article class="lcard ${read?'read':''}" data-d="${l.id}"><div class="lid"><span>${l.id} · ${D(l).year}</span><span class="star ${faved?'on':''}" data-fav="${l.id}">${faved?'★':'☆'}</span></div><div class="lko">${esc(l.ko)}</div><div class="lzh">${esc(l.zh)}${l.zhType==='reference'?' <span style="color:var(--brown);font-size:.68rem">参考译文</span>':''}</div>${store.ko?'<div class="zhrev" data-d="'+l.id+'">轻触显示中文字幕</div>':''}<div class="lmeta"><span class="dr">${D(l).zh}</span><span>·</span><span>${l.char}</span><span style="margin-left:auto"></span>${tagsHtml(l)}</div></article>`}
function lgrid(list){return `<div class="lgrid">${list.map(lcard).join('')}</div>`}
function voiceHtml(ko){const parts=ko.match(/[^.!?…]+[.!?…]*/g)||[ko];return parts.map((p,i)=>`<span class="vo" style="animation-delay:${i*0.45}s">${esc(p.trim())}</span>`).join('')}
function vHome(){const lod=todayLine(),picks=RANK.slice(0,6).map(byId),rec=recForYou();const emo=Object.keys(THEMES).filter(t=>linesByT(t).length).map(t=>`<div class="emo" data-t="${t}"><span class="en">${linesByT(t).length}</span><span class="ez">${THEMES[t].zh}</span><span class="ek">${THEMES[t].ko}</span></div>`).join('');const studies=`<div class="study-grid"><div class="study" data-go="same-emotion"><h4>同一种情绪</h4><span class="sen">Same Emotion</span><p>不同韩剧、不同编剧，怎样写"喜欢""离别""孤独"。</p></div><div class="study" data-go="same-word"><h4>同个韩语词</h4><span class="sen">Same Word</span><p>사랑·잘 살다·처음·눈부시다，在不同场景里的不同感觉。</p></div><div class="study" data-go="subtitle-study"><h4>原文与字幕的距离</h4><span class="sen">Subtitle vs Original</span><p>韩文原意、正式字幕、直译与语气差异。</p></div><div class="study" data-go="characters"><h4>人物成长弧</h4><span class="sen">Character Arc</span><p>用台词本身看一个人怎么说话、怎么改变。</p></div></div>`;const posters=picks.map((l,i)=>`<article class="poster${i===0?' featured':''}" data-d="${l.id}"><div class="no">0${i+1}</div><div class="pko">${esc(l.ko.length>60?l.ko.slice(0,60)+'…':l.ko)}</div><div class="pzh">${esc(l.zh.length>46?l.zh.slice(0,46)+'…':l.zh)}</div>${l.editorNote?`<div class="ped">${esc(l.editorNote)}</div>`:''}<div class="pmeta">${D(l).zh} · ${l.char}</div></article>`).join('');return `<section class="hero"><div class="hero-watermark">말</div><div class="hero-content"><div class="kick">A Private Museum of Korean Drama Lines</div><h1>K-Drama Lines</h1><div class="zht">韩 剧 台 词 私 人 博 物 馆</div><p class="spirit">有些台词只在屏幕上存在几秒，<br>却会在一个人的心里，<em>停留很多年</em>。</p></div><div class="hero-meta"><span>${LINES.length} LINES</span><span>${Object.keys(DRAMAS).length} DRAMAS</span><span>한글 × 中文</span><span>LOCAL ONLY</span><span class="read-progress">已读 ${store.read.length}/${LINES.length}</span></div><div class="hero-act"><button class="btn-p" data-go="rank">进入编辑精选</button><button class="btn-g" data-go="tonight">今晚的一句</button><button class="btn-g" data-go="journey">随机情绪旅程</button></div></section><div class="tonight" data-go="tonight"><div class="lab">TONIGHT'S LINE · 今晚的一句 · ${lod.id}</div><div class="tko">${esc(lod.ko)}</div><div class="tzh">${esc(lod.zh)}</div><div class="tmeta">${D(lod).zh} · ${lod.char} · ${lod.lineType.join(' / ')}</div></div><div class="sh"><h2>编辑精选</h2><span class="sub">Editor's Pick · 不按热度</span><span class="more" data-go="rank">全部 →</span></div><p class="lede">从文学性、人物塑造、情绪力量、语言美感与剧情作用中精选，每句附编辑评语。</p><div class="poster-grid">${posters}</div><div class="sh"><h2>为你而选</h2><span class="sub">Based on your reading</span></div><p class="lede">${store.favs.length?'根据你的收藏与阅读偏好推荐（本地规则，非虚构数据）。':'你还没有收藏，先从编辑精选开始；收藏后这里会按你的偏好推荐。'}</p>${lgrid(rec)}<div class="sh"><h2>按情绪寻找</h2><span class="sub">By Emotion</span></div><p class="lede">不必按剧名找。按你此刻的状态进入：想看爱情、想被治愈、最近有点孤独……</p><div class="emo-grid">${emo}</div><div class="sh"><h2>研究室</h2><span class="sub">Research · 语言与翻译</span></div>${studies}<div class="footer-note">档案凡例：韩文尽量保留剧中原文；中文优先采用通行正式字幕，无法确认者明确标注"参考译文"，绝不以 AI 译文冒充原字幕。仅收录短小台词用于学习欣赏，不复制完整字幕。详见<a data-go="about" style="color:var(--wine);cursor:pointer">「档案凡例」</a>。</div>`}
function vEmotions(){const list=Object.keys(THEMES).filter(t=>linesByT(t).length);return `<div class="crumb"><span data-go="home">首页</span>/<span>全部主题</span></div><div class="mag-head"><div class="mk">BY EMOTION</div><h2>按情绪与人生主题</h2><div class="mnote">一句台词可以同时属于多个主题，因为情绪本就彼此交叠。点击进入对应主题。</div></div><div class="emo-grid">${list.map(t=>`<div class="emo" data-t="${t}"><span class="en">${linesByT(t).length}</span><span class="ez">${THEMES[t].zh}</span><span class="ek">${THEMES[t].ko}</span></div>`).join('')}</div>`}
function vEmotion(t){const th=THEMES[t],list=linesByT(t);return `<div class="crumb"><span data-go="home">首页</span>/<span data-go="emotions">主题</span>/<span>${th.zh}</span></div><div class="mag-head"><div class="mk">${th.ko}</div><h2>${th.zh}</h2><div class="mnote">共 ${list.length} 句。同一种情绪，不同的人、不同的剧、不同的说法。</div></div>${list.length?lgrid(list):'<div class="empty"><div class="big">coming soon…</div>本主题正在持续收录中</div>'}`}
function vRank(){return `<div class="crumb"><span data-go="home">首页</span>/<span>编辑精选</span></div><div class="mag-head"><div class="mk">EDITOR'S PICK</div><h2>经典台词精选榜</h2><div class="mnote">本榜为「编辑精选」，依据文学性、情绪感染力、人物塑造价值与剧情重要性综合挑选，并非真实用户统计，也不按网络热度排序。</div></div>${RANK.map((id,i)=>{const l=byId(id);return `<div class="rank-row" data-d="${id}"><div class="rank-no">${String(i+1).padStart(2,'0')}</div><div class="rank-body"><div class="rk">${esc(l.ko)}</div><div class="rz">${esc(l.zh)} —— ${D(l).zh} · ${l.char}</div>${l.editorNote?`<div style="font-size:.78rem;color:var(--mute);margin-top:.4rem;font-style:italic;line-height:1.8">${esc(l.editorNote)}</div>`:''}</div></div>`}).join('')}`}
function vDramas(){const cards=Object.keys(DRAMAS).map(k=>{const d=DRAMAS[k],ls=LINES.filter(l=>l.drama===k),chars=[...new Set(ls.map(l=>l.char))].join(' / ');return `<article class="drama-hero" data-k="${k}"><div class="dko">${d.ko}</div><div class="dzh">${d.zh}</div><div class="dmeta">${d.year} · ${d.net} · ${d.genre} · 精选 ${ls.length} 句</div><div class="dstyle">${d.style}</div><div class="dmeta" style="margin-top:.8rem">代表人物语言：${chars||'—'}</div></article>`}).join('');return `<div class="crumb"><span data-go="home">首页</span>/<span>按剧集</span></div><div class="mag-head"><div class="mk">BY DRAMA</div><h2>剧集档案</h2><div class="mnote">覆盖爱情、家庭、职场、悬疑、法律、现实等题材，看韩剧如何在不同类型里写人与关系。</div></div>${cards}`}
function vDrama(k){const d=DRAMAS[k],ls=LINES.filter(l=>l.drama===k),chars=[...new Set(ls.map(l=>l.char))];return `<div class="crumb"><span data-go="home">首页</span>/<span data-go="dramas">剧集</span>/<span>${d.zh}</span></div><div class="drama-hero"><div class="dko">${d.ko}</div><div class="dzh">${d.zh}</div><div class="dmeta">${d.year} · ${d.net} · ${d.genre}</div><div class="dstyle">${d.style}</div></div><div class="dinfo"><div><b>年份</b>${d.year}</div><div><b>播出</b>${d.net}</div><div><b>类型</b>${d.genre}</div><div><b>馆藏</b>${ls.length} 句</div><div><b>人物</b>${chars.join('、')}</div></div><div class="sh"><h2>本剧经典台词</h2><span class="sub">${ls.length} lines</span></div>${lgrid(ls)}`}
function vCharacters(){const cards=CHARACTERS.map(c=>{const d=DRAMAS[c.drama],ls=LINES.filter(l=>l.drama===c.drama&&l.char===c.name);return `<article class="char-hero" data-c="${c.id}" style="cursor:pointer"><h2>${c.name} <span class="cko">${c.ko}</span> <span style="font-size:.85rem;color:var(--mute);font-weight:400">${d.zh} · ${c.actor} 饰</span></h2><div class="arc">${c.arc}</div><div class="dmeta" style="margin-top:.6rem">馆藏相关台词 ${ls.length} 句 →</div></article>`}).join('');return `<div class="crumb"><span data-go="home">首页</span>/<span>按人物</span></div><div class="mag-head"><div class="mk">BY CHARACTER · CHARACTER ARC</div><h2>人物语言档案</h2><div class="mnote">不介绍演员，只追踪一个人"怎么说话"：从开头到结尾，语言如何随命运变化。点击进入人物成长弧。</div></div>${cards}`}
function vCharacter(id){const c=CHARACTERS.find(x=>x.id===id),d=DRAMAS[c.drama],ls=LINES.filter(l=>l.drama===c.drama&&l.char===c.name);const stages=[{k:'early',n:'早期'},{k:'mid',n:'中期'},{k:'late',n:'后期'}];const tl=stages.map(s=>{const ss=ls.filter(l=>(l.arcStage||'mid')===s.k);if(!ss.length)return'';return `<div class="arc-stage"><div class="as">${s.n}</div>${ss.map(l=>`<div class="at" data-d="${l.id}" style="cursor:pointer">${esc(l.ko)}</div><div style="font-size:.8rem;color:var(--mute);margin:.1rem 0 .6rem">${esc(l.zh)}</div>`).join('')}</div>`}).join('');return `<div class="crumb"><span data-go="home">首页</span>/<span data-go="characters">人物</span>/<span>${c.name}</span></div><div class="char-hero"><h2>${c.name} <span class="cko">${c.ko}</span> <span style="font-size:.85rem;color:var(--mute);font-weight:400">${d.zh} · ${c.actor} 饰</span></h2><div class="arc">${c.arc}</div></div><div class="sh"><h2>人物成长弧</h2><span class="sub">Through Lines · 用台词见证变化</span></div><div class="arc-timeline">${tl||'<p style="color:var(--mute)">该人物台词尚在持续收录中。</p>'}</div>`}
function vScenes(){const cards=SCENES.map(s=>{const l=byId(s.line);return `<article class="lcard" data-d="${s.line}"><div class="lid"><span>SCENE · ${D(l).zh}</span><span>${l.char}</span></div><h3 style="font-size:1.1rem;margin:.6rem 0">${s.title}</h3><div class="lko" style="font-size:1.02rem">${esc(l.ko)}</div><p style="font-size:.82rem;color:var(--ink-2);margin-top:.3rem;line-height:1.9"><b style="color:var(--wine)">场景：</b>${s.what}</p><p style="font-size:.82rem;color:var(--ink-2);margin-top:.4rem;line-height:1.9"><b style="color:var(--wine)">为何成为名场面：</b>${s.beat}</p><div class="lmeta"><span>点开查看完整 Line Archive →</span></div></article>`}).join('');return `<div class="crumb"><span data-go="home">首页</span>/<span>名场面</span></div><div class="mag-head"><div class="mk">SCENE ARCHIVE</div><h2>名场面档案</h2><div class="mnote">不只记录台词，更把它放回那一刻：人物刚经历了什么、面对谁、冲突在哪。仅用必要上下文，不复制连续对白。</div></div><div class="lgrid">${cards}</div>`}
function vDetail(id){const l=byId(id);if(!l)return'<div class="empty">未找到</div>';markRead(id);const d=D(l);return `<div class="archive"><div class="crumb"><span data-go="home">首页</span>/<span data-k="${l.drama}">${d.zh}</span>/<span>${l.id}</span></div><div class="stage${l.mood?' mood-'+l.mood:''}" data-mood="${l.mood||'quiet-street'}"><div class="stage-id"><span>LINE ARCHIVE · ${l.id}</span>${badge(l)}</div><div class="stage-ko">${voiceHtml(l.ko)}</div><div class="stage-zh" id="stageZh">${esc(l.zh)}${l.zhType==='reference'?' <span style="color:var(--brown);font-size:.7rem">中文为参考译文 · 非官方字幕</span>':''}</div><div style="margin-top:.8rem"><button class="understand" id="undBtn">收起中文字幕</button></div><div class="stage-act"><button class="mbtn ${store.favs.includes(l.id)?'on':''}" data-fav="${l.id}">${store.favs.includes(l.id)?'★ 已收藏':'☆ 收进台词书'}</button><button class="mbtn" data-imm="${l.id}">深度阅读</button><button class="mbtn" data-rand="1">随机下一句 ∿</button></div><div class="ab"><div class="ctx-grid"><div><b>剧名</b>${d.zh}（<span class="ko">${d.ko}</span>）</div><div><b>年份/台</b>${d.year} · ${d.net}</div><div><b>角色</b>${l.char} <span style="color:var(--mute)">/ ${l.actor||'—'}</span></div><div><b>出处</b>${l.ep}</div><div><b>人物关系</b><span class="tag rel">${l.relationship}</span></div><div><b>台词类型</b>${ltHtml(l)}</div></div></div><div class="ab"><h6>Context · 上下文</h6><p><b style="color:var(--ink)">发生前：</b>${l.before}</p><p><b style="color:var(--ink)">发生后：</b>${l.after}</p></div><div class="ab"><h6>Why It Stays · 为什么这句话会留下来</h6><div class="why">${l.whyStays}</div></div>${l.anatomy?`<div class="ab"><h6>Dialogue Anatomy · 台词解剖</h6><div class="anat"><div><b>语言 Language</b><span>${l.anatomy.language}</span></div><div><b>人物 Character</b><span>${l.anatomy.character}</span></div><div><b>情绪 Emotion</b><span>${l.anatomy.emotion}</span></div><div><b>剧情 Plot</b><span>${l.anatomy.plot}</span></div></div></div>`:''}${l.nuance?`<div class="ab"><h6>Korean Nuance · 韩语语感</h6><div class="nuance">${l.nuance}</div></div>`:''}${(l.note||l.subtitleCompare)?`<div class="ab"><h6>Subtitle Notes · 字幕翻译笔记</h6><div class="tnote">${l.note?`<div class="row"><div class="k">直译含义</div><div class="v">${l.note.literal}</div></div><div class="row"><div class="k">正式字幕</div><div class="v">${l.note.official}</div></div><div class="row"><div class="k">为何这样译</div><div class="v">${l.note.why}</div></div>`:''}${l.subtitleCompare?`<div class="subcmp">${l.subtitleCompare.map(v=>`<div class="ver"><b>${v.source}</b>${v.text}<br><span style="color:var(--mute);font-size:.74rem">${v.note}</span></div>`).join('')}</div>`:''}</div></div>`:''}${l.editorNote?`<div class="editorpick"><b>EDITOR'S NOTE</b>${l.editorNote}</div>`:''}${l.law?`<div class="lawnote">${l.law}</div>`:''}<div class="ab"><h6>Themes · 主题</h6><div>${tagsHtml(l)}</div></div><div class="legend"><span>核验：${l.verify==='v'?'已对照公开中韩字幕逐字核校':'韩文为通行原句、中文为通行字幕，建议以正版片源校字'}</span></div></div></div>`}
function vSection(k){const s=SECTIONS[k],list=LINES.filter(l=>s.ids.some(t=>l.themes.includes(t)));return `<div class="crumb"><span data-go="home">首页</span>/<span>专题</span>/<span>${s.title}</span></div><div class="mag-head"><div class="mk">${s.title}</div><h2>${s.zh}</h2><div class="mnote">${s.desc}</div></div>${k==='law'?'<div class="lawnote" style="margin-bottom:1rem">提示：本专题台词均为影视剧的戏剧化表达，不能作为现实法律判断或结论。</div>':''}${lgrid(list)}`}
function vSameEmotion(){const cores=['love','loneliness','growth','farewell','healing'];const blocks=cores.map(t=>{const list=linesByT(t);if(!list.length)return'';return `<div class="word-block"><div class="wh"><span class="w">${THEMES[t].zh}</span><span class="wz">${THEMES[t].ko} · ${list.length} 种表达</span></div><div class="cmp-row">${list.slice(0,4).map(l=>`<div class="cr" data-d="${l.id}"><div class="crk">${esc(l.ko)}</div><div class="crz">${esc(l.zh)}</div><div class="crm">${D(l).zh} · ${l.char}</div></div>`).join('')}</div></div>`}).join('');return `<div class="crumb"><span data-go="home">首页</span>/<span>同情绪 · 不同韩剧</span></div><div class="mag-head"><div class="mk">SAME EMOTION, DIFFERENT DRAMAS</div><h2>同一种情绪，不同韩剧怎么表达</h2><div class="mnote">把不同作品放在一起横向比较，看不同编剧、不同人物如何写同一种心情。</div></div>${blocks}`}
function vSameWord(){const blocks=WORDS.map(w=>{const ls=w.ids.map(byId).filter(Boolean);return `<div class="word-block"><div class="wh"><span class="w">${w.word}</span><span class="wz">${w.zh} · ${w.note}</span></div><div class="cmp-row">${ls.map(l=>`<div class="cr" data-d="${l.id}"><div class="crk">${esc(l.ko)}</div><div class="crz">${esc(l.zh)}</div><div class="crm">${D(l).zh} · ${l.char} · ${l.lineType.join('/')}</div></div>`).join('')}</div></div>`}).join('');return `<div class="crumb"><span data-go="home">首页</span>/<span>同词不同情绪</span></div><div class="mag-head"><div class="mk">SAME KOREAN WORD, DIFFERENT EMOTION</div><h2>同一个韩语词，在不同场景里的不同感觉</h2><div class="mnote">翻译成中文意思差不多，但语气、关系和情绪已经完全不同——这正是韩语的语境魅力。</div></div>${blocks}`}
function vSubtitleStudy(){const list=LINES.filter(l=>l.note||l.subtitleCompare);const cards=list.map(l=>`<article class="lcard" data-d="${l.id}"><div class="lid"><span>SUBTITLE STUDY · ${l.id}</span>${badge(l)}</div><div class="lko">${esc(l.ko)}</div><div class="lzh">${esc(l.zh)}</div>${l.note?`<div style="font-size:.78rem;color:var(--ink-2);margin-top:.6rem;line-height:1.8"><b style="color:var(--wine)">直译：</b>${l.note.literal}<br><b style="color:var(--wine)">译法：</b>${l.note.why}</div>`:''}<div class="lmeta"><span class="dr">${D(l).zh}</span></div></article>`).join('');return `<div class="crumb"><span data-go="home">首页</span>/<span>原文与字幕的距离</span></div><div class="mag-head"><div class="mk">SUBTITLE vs ORIGINAL</div><h2>原文与字幕之间的距离</h2><div class="mnote">韩文原句、正式中文字幕、直译含义与语气差异。优秀字幕是再创作——这里看它如何在忠实与文学性之间平衡。所有译文均明确来源，不以 AI 译文冒充官方字幕。</div></div><div class="lgrid">${cards}</div>`}
function vJourney(){const j=JOURNEYS[Math.floor(Math.random()*JOURNEYS.length)];const used=new Set();const stages=j.stages.map(s=>{const pool=linesByT(s.theme).filter(l=>!used.has(l.id));const l=pool[Math.floor(Math.random()*pool.length)]||randLine();used.add(l.id);return{...s,l}});return `<div class="crumb"><span data-go="home">首页</span>/<span>随机情绪旅程</span></div><div class="mag-head"><div class="mk">RANDOM EMOTIONAL JOURNEY</div><h2>${j.name}</h2><div class="mnote">没有特定目标时，让几句台词带你走一段情绪。点击任意一句进入完整档案。</div></div><button class="btn-g" id="jAgain" style="margin-bottom:1.2rem">换一段旅程 ∿</button>${stages.map((s,i)=>`<div class="journey"><div class="js">STEP ${i+1} · ${s.label}</div><div class="lcard" data-d="${s.l.id}" style="cursor:pointer"><div class="lko">${esc(s.l.ko)}</div><div class="lzh">${esc(s.l.zh)}</div><div class="lmeta"><span class="dr">${D(s.l).zh}</span><span>·</span><span>${s.l.char}</span></div></div></div>`).join('')}`}
function vTonight(){const l=todayLine();return `<div class="imm-full" style="position:static;min-height:80vh"><div class="glow"></div><button class="icon-btn iclose" data-go="home" style="position:absolute">✕</button><div class="inner"><div class="mono" style="color:var(--mute);letter-spacing:.24em;font-size:.7rem">TONIGHT'S LINE · ${l.id}</div><div class="iko" style="margin-top:2rem">${esc(l.ko)}</div><div class="izh">${esc(l.zh)}</div><div class="imeta">${D(l).zh} · ${l.char} · ${l.lineType.join(' / ')}</div><div class="iact"><button class="btn-p" data-d="${l.id}">进入完整档案</button><button class="btn-g" data-go="home">回到发现页</button></div></div></div>`}
function vFavorites(){const f=store.favs.map(byId).filter(Boolean);if(!f.length)return'<div class="empty"><div class="big">你的台词书还是空的</div><p>读到喜欢的句子，点 ☆ 收进来。它只存在你的浏览器本地，不上传任何数据。</p><button class="btn-p" style="margin-top:1.2rem" data-go="home">去发现一句</button></div>';let list=f;if(S.favFilter==='drama')list=[...f].sort((a,b)=>D(a).zh.localeCompare(D(b).zh));if(S.favFilter==='theme')list=[...f].sort((a,b)=>(a.themes[0]||'').localeCompare(b.themes[0]||''));if(S.favFilter==='tag'){const hasTag=f.filter(l=>(store.tags[l.id]||[]).length);list=hasTag.length?hasTag:f}const filters=[['time','按收藏时间'],['drama','按剧集'],['theme','按主题'],['tag','按私人标签']];const cards=list.map(l=>{const ptags=(store.tags[l.id]||[]).map(t=>`<span class="ptag">${esc(t)} <span data-rmtag="${l.id}|${t}">×</span></span>`).join('');return `<article class="lcard" data-d="${l.id}"><div class="lid"><span>${l.id}</span><span class="star on" data-fav="${l.id}">★</span></div><div class="lko">${esc(l.ko)}</div><div class="lzh">${esc(l.zh)}</div><div class="ptags">${ptags}</div><input class="ptag-input" placeholder="加私人标签，回车保存（如：最近的自己）" data-ptag="${l.id}"><div class="lmeta"><span class="dr">${D(l).zh}</span><span>·</span><span>${l.char}</span><span style="margin-left:auto"></span>${tagsHtml(l)}</div></article>`}).join('');return `<div class="crumb"><span data-go="home">首页</span>/<span>我的台词书</span></div><div class="mag-head"><div class="mk">PERSONAL QUOTE BOOK · MEMORY MODE</div><h2>我的台词书</h2><div class="mnote">共 ${f.length} 句，按主题自动整理。可加私人标签，所有内容仅存本地。</div></div><div class="shelf-filter">${filters.map(([k,n])=>`<button class="${S.favFilter===k?'on':''}" data-ff="${k}">${n}</button>`).join('')}<button id="clearFav" style="margin-left:auto;color:var(--wine)">清空</button></div><div class="lgrid">${cards}</div>`}
function vSearch(q){const k=q.trim().toLowerCase();if(!k)return'<div class="empty">输入关键词开始搜索</div>';const res=LINES.filter(l=>{const d=D(l);return (l.ko+l.zh+d.zh+d.ko+l.char+(l.actor||'')+(l.lineType||[]).join('')+(l.relationship||'')+l.themes.map(tname).join('')).toLowerCase().includes(k)});const hl=s=>{const i=s.toLowerCase().indexOf(k);if(i<0)return esc(s);return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+k.length))+'</mark>'+esc(s.slice(i+k.length))};const cards=res.map(l=>`<article class="lcard" data-d="${l.id}"><div class="lid"><span>${l.id}</span></div><div class="lko">${hl(l.ko)}</div><div class="lzh">${hl(l.zh)}</div><div class="lmeta"><span class="dr">${hl(D(l).zh)}</span>·<span>${hl(l.char)}</span>${ltHtml(l)}</div></article>`).join('');return `<div class="crumb"><span data-go="home">首页</span>/<span>搜索：${esc(q)}</span></div><div class="sh"><h2>搜索结果</h2><span class="sub">${res.length} found · 支持韩文/中文/剧名/角色/主题/台词类型</span></div>${res.length?`<div class="lgrid">${cards}</div>`:'<div class="empty">没有找到，换个关键词试试。</div>'}`}
function vAbout(){return `<div class="archive"><div class="crumb"><span data-go="home">首页</span>/<span>档案凡例</span></div><div class="mag-head"><div class="mk">EDITORIAL POLICY</div><h2>档案凡例</h2></div><div class="stage${l.mood?' mood-'+l.mood:''}" data-mood="${l.mood||''}"><div class="ab"><h6>一、真实性与核验</h6><p>只收录在剧中真实出现、能在公开字幕与可靠资料中相互印证的短小台词。每条标注：<br><span class="badge v">字幕核校</span> 已对照公开中韩字幕逐字核校；<span class="badge c">字幕整理</span> 韩文为通行原句、中文采用通行正式字幕，建议以正版片源校字；<span class="badge r">参考译文</span> 仅确认韩文、无法锁定正式中文字幕，中文明确标为参考译文，<b>绝不以 AI 译文冒充剧中字幕</b>。</p></div><div class="ab"><h6>二、版权边界</h6><p>仅摘录必要的短小台词用于学习与欣赏，<b>不复制任何剧集的完整字幕或连续长段对白</b>；台词著作权归原权利人。不使用受版权保护的剧照，所有氛围由原创 CSS（纸纹、胶片齿孔、光影、雨丝）构成。</p></div><div class="ab"><h6>三、多标签与不机械分类</h6><p>同一句台词可同时属于爱情、成长与人生，故采用多主题标签，并按"台词表达了什么情绪"而非剧集类型分类。另设台词类型（独白/告别/质问/反转等）与人物关系维度。</p></div><div class="ab"><h6>四、法律题材声明</h6><p>法律、悬疑类台词是戏剧表达，不构成、也不替代现实法律意见。</p></div><div class="ab"><h6>五、你的数据</h6><p>收藏、阅读记录、私人标签、深浅色与韩文模式仅保存在你浏览器的 localStorage，本地存储，无需注册、不联网上传。</p></div><div class="ab"><h6>六、持续收录</h6><p>坚持"少而精"：宁可一百句可靠、有上下文的台词，也不堆砌来源不明的网络语录。标注"来源待核实"的内容暂不进入本馆。</p></div><div class="ab"><h6>七、第二阶段升级说明</h6><p>本版从"资料库"升级为"私人博物馆"：每句补充发生前/发生后/Why It Stays/台词类型/人物关系/场景氛围；精选句增加 Dialogue Anatomy 与字幕翻译比较；新增同情绪跨剧、同词不同情绪、原文与字幕距离、人物成长弧、随机情绪旅程、今晚一句、私人标签与回忆模式、本地推荐与阅读进度。</p></div></div></div>`}
function render(){const v=$('#view');let h='';switch(S.view){case'home':h=vHome();break;case'emotions':h=vEmotions();break;case'emotion':h=vEmotion(S.filter);break;case'rank':h=vRank();break;case'dramas':h=vDramas();break;case'drama':h=vDrama(S.filter);break;case'characters':h=vCharacters();break;case'character':h=vCharacter(S.filter);break;case'scenes':h=vScenes();break;case'detail':h=vDetail(S.detail);break;case'section':h=vSection(S.filter);break;case'same-emotion':h=vSameEmotion();break;case'same-word':h=vSameWord();break;case'subtitle-study':h=vSubtitleStudy();break;case'journey':h=vJourney();break;case'tonight':h=vTonight();break;case'favorites':h=vFavorites();break;case'search':h=vSearch(S.search);break;case'about':h=vAbout();break}v.innerHTML=h;const lod=todayLine(),topD=Object.keys(DRAMAS).map(k=>({k,n:LINES.filter(l=>l.drama===k).length})).sort((a,b)=>b.n-a.n).slice(0,6);$('#rail').innerHTML=`<div class="rail-card"><h5>Tonight · 今晚</h5><div class="rail-line" data-d="${lod.id}"><span class="ko" style="font-size:.88rem;color:var(--ink)">${esc(lod.ko.slice(0,40))}${lod.ko.length>40?'…':''}</span><small>${D(lod).zh} · ${lod.char}</small></div></div><div class="rail-card"><h5>By Drama · 馆藏</h5>${topD.map(x=>`<div class="rail-line" data-k="${x.k}">${DRAMAS[x.k].zh}<small>${DRAMAS[x.k].year} · ${x.n} 句</small></div>`).join('')}</div><div class="rail-card"><h5>Reading · 阅读</h5><div class="rail-line" id="railKo">가 纯韩文模式：${store.ko?'开启':'关闭'}</div><div class="rail-line" data-go="journey">∿ 随机情绪旅程</div><div class="rail-line" data-go="same-word">가 同词不同情绪</div><div class="rail-line" data-go="about">§ 档案凡例</div><div class="rail-line"><span class="read-progress">已读 ${store.read.length}/${LINES.length}</span></div></div>`;$('#navEmo').innerHTML=Object.keys(THEMES).filter(t=>linesByT(t).length).map(t=>`<div class="navi ${S.view==='emotion'&&S.filter===t?'on':''}" data-t="${t}">${THEMES[t].zh}<span class="c">${linesByT(t).length}</span></div>`).join('');$$('.nav-main button').forEach(b=>b.classList.toggle('on',b.dataset.go===S.view));$$('.navi').forEach(n=>{const g=n.dataset.go;if(g)n.classList.toggle('on',S.view===g)});document.body.classList.toggle('ko-only',store.ko);window.scrollTo({top:0,behavior:'smooth'});const ub=$('#undBtn');if(ub)ub.onclick=()=>{var z=$('#stageZh');z.classList.toggle('hidden-zh');ub.textContent=z.classList.contains('hidden-zh')?'理解这句 · 显示中文字幕':'收起中文字幕'}}

function openImm(id){const l=byId(id),d=D(l);const o=document.createElement('div');o.className='imm-full';o.innerHTML=`<div class="glow"></div><button class="icon-btn iclose">✕</button><div class="inner"><div class="mono" style="color:var(--mute);letter-spacing:.24em;font-size:.7rem">DEEP READING · ${l.id}</div><div class="iko" style="margin-top:2rem">${voiceHtml(l.ko)}</div><div class="izh">${esc(l.zh)}</div><p style="margin-top:2rem;color:var(--ink-2);font-size:.9rem;max-width:36em;line-height:2;opacity:0;animation:voIn 1s 2s ease forwards">${l.before}</p><div class="imeta">${d.zh} · ${l.char}${l.actor?' / '+l.actor:''} · ${l.ep}</div><div class="iact"><button class="btn-p" id="immFav">${store.favs.includes(id)?'★ 已收藏':'☆ 收藏'}</button><button class="btn-g" id="immDetail">查看完整档案</button><button class="btn-g" id="immExit">返回</button></div></div>`;document.body.appendChild(o);document.body.style.overflow='hidden';const c=()=>{o.remove();document.body.style.overflow=''};o.querySelector('.iclose').onclick=c;o.querySelector('#immExit').onclick=c;o.querySelector('#immFav').onclick=()=>{toggleFav(id);c();openImm(id)};o.querySelector('#immDetail').onclick=()=>{c();S.view='detail';S.detail=id;render()}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-d],[data-t],[data-k],[data-c],[data-fav],[data-imm],[data-rand],[data-ff],[data-rmtag]');if(!t)return;e.preventDefault();if(t.dataset.fav){toggleFav(t.dataset.fav);return}if(t.dataset.imm){openImm(t.dataset.imm);return}if(t.dataset.d){S.view='detail';S.detail=t.dataset.d;render();return}if(t.dataset.t){go('emotion',t.dataset.t);return}if(t.dataset.k){go('drama',t.dataset.k);return}if(t.dataset.c){go('character',t.dataset.c);return}if(t.dataset.rand){const l=randLine();S.detail=l.id;S.view='detail';render();return}if(t.dataset.ff){S.favFilter=t.dataset.ff;render();return}if(t.dataset.rmtag){const[id,tag]=t.dataset.rmtag.split('|');const ts=store.tags;ts[id]=(ts[id]||[]).filter(x=>x!==tag);store.tags=ts;render();return}const g=t.dataset.go;if(!g)return;if(g==='journey'){go('journey');return}if(g.startsWith('sec-')){go('section',g.slice(4));return}if(g==='home'){S={view:'home',filter:null,detail:null,search:'',favFilter:'time'};render();return}go(g)});

// === Interaction Upgrade v3 ===
function _afterRender(){
  const v=document.getElementById('view');
  if(!v)return;
  v.classList.remove('view-enter');
  void v.offsetWidth;
  v.classList.add('view-enter');
  var idx=0;
  v.querySelectorAll('.lc,.emo-card,.drama-card,.char-card,.rank-row,.scene-card,.journey-card,.word-block').forEach(function(el){
    if(!el.classList.contains('reveal')){
      el.classList.add('reveal');
      el.style.transitionDelay=(Math.min(idx,10)*35)+'ms';
      idx++;
    }
  });
  if(window._revealIO){
    v.querySelectorAll('.reveal:not(.visible)').forEach(function(el){window._revealIO.observe(el)});
  }
}
document.addEventListener('click',function(e){
  const t=e.target.closest('.lc,.emo-card,.rank-row,.drama-card,.char-card,.scene-card,button,.nav-item,.tag-pill,.journey-card,.word-block');
  if(!t)return;
  if(!t.classList.contains('ripple-host'))t.classList.add('ripple-host');
  const r=document.createElement('span');
  r.className='ripple';
  const rect=t.getBoundingClientRect();
  const size=Math.max(rect.width,rect.height)*1.1;
  r.style.width=r.style.height=size+'px';
  r.style.left=(e.clientX-rect.left-size/2)+'px';
  r.style.top=(e.clientY-rect.top-size/2)+'px';
  t.appendChild(r);
  setTimeout(function(){r.remove()},600);
});
window._revealIO=new IntersectionObserver(function(entries){
  entries.forEach(function(en){
    if(en.isIntersecting){en.target.classList.add('visible');window._revealIO.unobserve(en.target)}
  });
},{threshold:.06,rootMargin:'0px 0px -20px 0px'});
document.addEventListener('click',function(e){
  const b=e.target.closest('.fav-btn');
  if(b){b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump')}
});

function handleMobileSearch(q){

    render();

// v4.8 Scroll reveal
function initReveal(){
  var els = document.querySelectorAll('.lcard,.poster,.emo,.study,.sh,.tonight,.stage');
  els.forEach(function(el){ el.classList.add('reveal'); });
  if('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){
          e.target.classList.add('visible');
          io.unobserve(e.target);
        }
      });
    },{threshold:.1,rootMargin:'0px 0px -40px 0px'});
    els.forEach(function(el){ io.observe(el); });
  } else {
    els.forEach(function(el){ el.classList.add('visible'); });
  }
}

function toggleMobileDrawer(){
  var d=document.getElementById('mobileDrawer');

  if(d&&o){
    d.classList.toggle('open');
    o.classList.toggle('open');
    document.body.style.overflow=d.classList.contains('open')?'hidden':'';
  }
}
